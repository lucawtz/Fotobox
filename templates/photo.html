<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto – {{ event_name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080503; color: #f0e6cc;
      font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
    }

    nav {
      display: flex; align-items: center; gap: .75rem;
      padding: .75rem 1rem;
      background: #1c0e04; border-bottom: 1px solid #2e1a08;
    }
    nav a { color: #d4a86a; text-decoration: none; font-size: .9rem; }
    nav a:hover { text-decoration: underline; }
    .filename { flex: 1; text-align: right; font-size: .7rem; color: #4a3520; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .photo-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: #080503;
    }
    .photo-wrap img { max-width: 100%; max-height: 78vh; border-radius: 6px; box-shadow: 0 8px 40px #0009; }

    .actions {
      padding: 1.25rem 1rem;
      display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem;
      background: #0d0704; border-top: 1px solid #2e1a08;
    }
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .75rem 1.75rem; border-radius: 99px;
      text-decoration: none; font-weight: 600; font-size: .95rem;
      transition: opacity .15s; border: none; cursor: pointer;
    }
    .btn:hover { opacity: .85; }
    .btn-primary   { background: #d4a86a; color: #1a0a02; }
    .btn-secondary { background: #1c0e04; color: #d4a86a; border: 1px solid #3a2010; }
    .btn-danger    { background: #5a1208; color: #ffddd5; }

    .error-msg {
      background: #3a0a02; color: #ff8870;
      border: 1px solid #6a1808; border-radius: 8px;
      padding: .65rem 1.2rem; font-size: .9rem;
      width: 100%; text-align: center;
    }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: #000a; z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1c0e04; border: 1px solid #3a2010;
      border-radius: 14px; padding: 2rem 1.75rem;
      width: min(100% - 2rem, 360px);
      display: flex; flex-direction: column; gap: 1rem;
    }
    .modal h3 { color: #e05535; font-size: 1.1rem; }
    .modal p  { font-size: .88rem; color: #a07848; }
    .modal input {
      width: 100%; padding: .6rem .9rem;
      background: #0d0704; border: 1px solid #3a2010;
      border-radius: 8px; color: #f0e6cc; font-size: 1rem;
      letter-spacing: .2em; text-align: center;
    }
    .modal input:focus { outline: 2px solid #d4a86a; }
    .modal-actions { display: flex; gap: .75rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">← Galerie</a>
    <span class="filename">{{ filename }}</span>
  </nav>

  <div class="photo-wrap">
    <img src="/img/{{ filename }}" alt="{{ filename }}">
  </div>

  <div class="actions">
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <a href="/download/{{ filename }}" class="btn btn-primary">⬇ Herunterladen</a>
    <a href="/" class="btn btn-secondary">Alle Fotos</a>
    <button onclick="document.getElementById('del-modal').classList.add('open')"
            class="btn btn-danger">🗑 Löschen</button>
  </div>

  <!-- Lösch-Modal -->
  <div id="del-modal" class="modal-overlay">
    <div class="modal">
      <h3>Foto löschen?</h3>
      <p>Dieser Vorgang kann nicht rückgängig gemacht werden.<br>Bitte Admin-PIN eingeben:</p>
      <form method="post" action="/delete/{{ filename }}">
        <input type="password" name="pin" inputmode="numeric"
               placeholder="••••" maxlength="12" autofocus required>
        <br><br>
        <div class="modal-actions">
          <button type="button" onclick="document.getElementById('del-modal').classList.remove('open')"
                  class="btn btn-secondary" style="flex:1">Abbrechen</button>
          <button type="submit" class="btn btn-danger" style="flex:1">Löschen</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto – Fotobox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080503; color: #f0e6cc;
      font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
    }

    nav {
      display: flex; align-items: center; gap: .75rem;
      padding: .75rem 1rem;
      background: #1c0e04; border-bottom: 1px solid #2e1a08;
    }
    nav a { color: #d4a86a; text-decoration: none; font-size: .9rem; }
    nav a:hover { text-decoration: underline; }
    nav .filename { flex: 1; text-align: right; font-size: .7rem; color: #4a3520; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .photo-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: #080503;
    }
    .photo-wrap img {
      max-width: 100%; max-height: 78vh;
      border-radius: 6px;
      box-shadow: 0 8px 40px #0009;
    }

    .actions {
      padding: 1.25rem 1rem;
      display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem;
      background: #0d0704; border-top: 1px solid #2e1a08;
    }
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .75rem 1.75rem; border-radius: 99px;
      text-decoration: none; font-weight: 600; font-size: .95rem;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary   { background: #d4a86a; color: #1a0a02; }
    .btn-secondary { background: #1c0e04; color: #d4a86a; border: 1px solid #3a2010; }
  </style>
</head>
<body>
  <nav>
    <a href="/">← Galerie</a>
    <span class="filename">{{ filename }}</span>
  </nav>

  <div class="photo-wrap">
    <img src="/img/{{ filename }}" alt="{{ filename }}">
  </div>

  <div class="actions">
    <a href="/download/{{ filename }}" class="btn btn-primary">⬇ Herunterladen</a>
    <a href="/" class="btn btn-secondary">Alle Fotos</a>
  </div>
</body>
</html>

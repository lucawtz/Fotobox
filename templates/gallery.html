<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotobox Galerie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #110a03; color: #f0e6cc; font-family: system-ui, sans-serif; min-height: 100vh; }

    header {
      padding: 1.25rem 1rem 1rem;
      text-align: center;
      background: #1c0e04;
      border-bottom: 1px solid #2e1a08;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1.4rem; color: #d4a86a; letter-spacing: .05em; }
    header p  { font-size: 0.8rem; color: #6a4f2e; margin-top: .25rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 3px;
      padding: 3px;
    }
    .card {
      aspect-ratio: 1;
      overflow: hidden;
      background: #1c0e04;
      border-radius: 3px;
    }
    .card a    { display: block; width: 100%; height: 100%; }
    .card img  { width: 100%; height: 100%; object-fit: cover; transition: transform .2s, opacity .3s; opacity: 0; }
    .card img.loaded { opacity: 1; }
    .card:hover img { transform: scale(1.06); }

    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem;
      min-height: 60vh; color: #4a3520; font-size: 1.1rem;
    }
    .empty span { font-size: 3rem; }

    #status {
      text-align: center; padding: .6rem;
      font-size: .7rem; color: #3a2810;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fotobox Galerie</h1>
    <p id="count-label">{{ photos|length }} Foto{{ 's' if photos|length != 1 else '' }}</p>
  </header>

  {% if photos %}
  <div class="grid" id="grid">
    {% for f in photos %}
    <div class="card">
      <a href="/photo/{{ f }}">
        <img data-src="/thumb/{{ f }}" alt="Foto">
      </a>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty">
    <span>📷</span>
    Noch keine Fotos — schieß los!
  </div>
  {% endif %}

  <div id="status">Aktualisiert alle 10 Sekunden</div>

  <script>
    // Lazy-load images
    const imgs = document.querySelectorAll('img[data-src]');
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const img = e.target;
          img.src = img.dataset.src;
          img.onload = () => img.classList.add('loaded');
          io.unobserve(img);
        }
      });
    });
    imgs.forEach(img => io.observe(img));

    // Auto-refresh when new photos arrive
    let known = {{ photos|length }};
    setInterval(async () => {
      try {
        const r = await fetch('/api/count');
        const d = await r.json();
        if (d.count !== known) location.reload();
      } catch {}
    }, 10000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Fotobox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #110a03; color: #f0e6cc;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .card {
      background: #1c0e04; border: 1px solid #2e1a08;
      border-radius: 14px; padding: 2.5rem 2rem;
      width: min(100%, 360px);
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    h1 { font-size: 1.4rem; color: #d4a86a; text-align: center; }
    label { font-size: .85rem; color: #a07848; }
    input[type="password"] {
      width: 100%; padding: .75rem 1rem;
      background: #0d0704; border: 1px solid #3a2010;
      border-radius: 8px; color: #f0e6cc; font-size: 1.2rem;
      letter-spacing: .3em; text-align: center;
    }
    input:focus { outline: 2px solid #d4a86a; border-color: transparent; }
    button {
      width: 100%; padding: .85rem;
      background: #d4a86a; color: #1a0a02;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button:hover { opacity: .88; }
    .error {
      background: #3a0a02; color: #ff8870;
      border: 1px solid #6a1808; border-radius: 8px;
      padding: .65rem 1rem; font-size: .9rem; text-align: center;
    }
    a { color: #6a4f2e; font-size: .8rem; text-align: center; text-decoration: none; }
    a:hover { color: #d4a86a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 Admin-Login</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div style="display:flex;flex-direction:column;gap:.5rem">
        <label for="pin">Admin-PIN</label>
        <input type="password" id="pin" name="pin" inputmode="numeric"
               maxlength="12" autofocus required placeholder="••••">
      </div>
      <br>
      <button type="submit">Anmelden</button>
    </form>
    <a href="/">← Zurück zur Galerie</a>
  </div>
</body>
</html>

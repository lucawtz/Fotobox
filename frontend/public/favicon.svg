<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Fotobox">
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="fv-photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="20" fill="url(#fv-bg)"/>

  <!-- Konfetti — bewusst kraeftig, damit es auch bei 32px sichtbar bleibt -->
  <circle cx="13" cy="22" r="3.5" fill="#fbbc04"/>
  <rect x="78" y="13" width="8" height="8" rx="1.2" fill="#ea4335" transform="rotate(22 82 17)"/>
  <circle cx="84" cy="76" r="3" fill="#34a853"/>
  <circle cx="11" cy="78" r="3" fill="#fbbc04"/>

  <!-- Hintere Polaroid (transparent, leicht gekippt) -->
  <g transform="rotate(-11 48 52)">
    <rect x="24" y="26" width="40" height="50" rx="3" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Vordere Polaroid -->
  <g transform="rotate(7 48 52)">
    <rect x="26" y="20" width="44" height="56" rx="3" fill="#ffffff"/>
    <rect x="30" y="24" width="36" height="36" rx="2" fill="url(#fv-photo)"/>
    <!-- Smiley (etwas groesser/dicker fuer kleine Darstellung) -->
    <circle cx="42" cy="38" r="2.6" fill="#ffffff"/>
    <circle cx="54" cy="38" r="2.6" fill="#ffffff"/>
    <path d="M 40.5 46 Q 48 54 55.5 46" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>

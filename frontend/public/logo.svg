<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-label="Fotobox">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="l-photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="l-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="l-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#0d2a66" flood-opacity="0.35"/>
    </filter>
    <style>
      .wm { font-family: 'Nunito','Poppins','Segoe UI Variable',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight: 800; font-size: 60px; letter-spacing: -1.5px; }
      .tag { font-family: 'Nunito','Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 5px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Mark -->
  <g transform="translate(2 2)">
    <rect width="96" height="96" rx="20" fill="url(#l-bg)"/>

    <circle cx="13" cy="22" r="3" fill="#fbbc04"/>
    <rect x="78" y="13" width="7" height="7" rx="1.2" fill="#ea4335" transform="rotate(22 81.5 16.5)"/>
    <circle cx="84" cy="76" r="2.8" fill="#34a853"/>
    <circle cx="11" cy="78" r="2.4" fill="#fbbc04"/>
    <path d="M 86 46 l 2.6 -2.6 l 2.6 2.6 l -2.6 2.6 z" fill="#ea4335"/>
    <path d="M 6 50 l 2.4 -2.4 l 2.4 2.4 l -2.4 2.4 z" fill="#34a853" opacity="0.85"/>

    <g transform="rotate(-11 48 52)" filter="url(#l-shadow)">
      <rect x="24" y="26" width="40" height="50" rx="3" fill="#ffffff" opacity="0.5"/>
    </g>

    <g transform="rotate(7 48 52)" filter="url(#l-shadow)">
      <rect x="26" y="20" width="44" height="56" rx="3" fill="#ffffff"/>
      <rect x="30" y="24" width="36" height="36" rx="2" fill="url(#l-photo)"/>
      <circle cx="42" cy="38" r="2.3" fill="#ffffff"/>
      <circle cx="54" cy="38" r="2.3" fill="#ffffff"/>
      <path d="M 41 46 Q 48 53 55 46" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <rect x="34" y="65" width="20" height="2.2" rx="1.1" fill="#1a73e8" opacity="0.35"/>
      <rect x="34" y="69.5" width="12" height="2.2" rx="1.1" fill="#1a73e8" opacity="0.25"/>
    </g>

    <g transform="translate(70 32)">
      <path d="M 0 -6 L 1.4 -1.4 L 6 0 L 1.4 1.4 L 0 6 L -1.4 1.4 L -6 0 L -1.4 -1.4 Z" fill="#fbbc04"/>
    </g>
  </g>

  <!-- Wordmark: Whimsy als Brand, Fotobox als Descriptor -->
  <text class="wm" x="116" y="60" fill="url(#l-text)">Whimsy</text>
  <text class="tag" x="118" y="84" fill="#1a73e8" opacity="0.7">Fotobox</text>
</svg>
